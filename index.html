<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="FrameBuffer Studio - open-source libraries and tools for Roblox. Home of Bloom, a low-level graphics library for EditableImage.">
    <title>FrameBuffer Studio</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./assets/site.css">
    <script type="module" src="./assets/site.js"></script>
  </head>
  <body>
    <div class="grid-lines" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="#/home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name" id="brand-name">FrameBuffer</span>
        <span class="brand-dim" id="brand-suffix">studio</span>
      </a>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <a class="tab" role="tab" href="#/home" data-view="home" data-ui="tab.home">home</a>
        <a class="tab" role="tab" href="#/products" data-view="products" data-ui="tab.products">products</a>
        <a class="tab" role="tab" href="#/team" data-view="team" data-ui="tab.team">team</a>
        <a class="tab" role="tab" href="#/support" data-view="support" data-ui="tab.support">support</a>
      </nav>
      <div class="topbar-actions">
        <a class="pill" id="github-link" href="https://github.com/FrameBuffer-Studio" target="_blank" rel="noopener noreferrer">github ↗</a>
        <button class="pill lang" id="lang" type="button" aria-label="Switch language"></button>
      </div>
    </header>

    <main class="page">
      <section class="view" id="view-home" role="tabpanel" data-view="home">
        <div class="hero">
          <p class="eyebrow" data-reveal><span class="dot" aria-hidden="true"></span><span data-ui="home.eyebrow"></span></p>
          <h1 class="display" data-reveal="mask"><span class="line"><span id="display-first">Frame</span></span><span class="line"><span><span id="display-second">Buffer</span><span class="display-dot">.</span></span></span></h1>
          <div class="hero-row">
            <p class="lead" data-reveal data-ui="home.lead"></p>
            <div class="hero-actions" data-reveal>
              <a class="button solid" href="#/products" data-ui="home.products"></a>
            </div>
          </div>
        </div>
        <div class="marquee" data-reveal aria-hidden="true">
          <div class="marquee-track" id="marquee"></div>
        </div>
        <div class="principles" id="principles"></div>
      </section>

      <section class="view" id="view-products" role="tabpanel" data-view="products" hidden>
        <header class="view-head">
          <p class="eyebrow" data-reveal><span class="index">01</span><span data-ui="products.eyebrow"></span></p>
          <h2 class="heading" data-reveal="mask"><span class="line"><span data-ui="products.title"></span></span></h2>
        </header>
        <div class="products" id="products"></div>
      </section>

      <section class="view" id="view-team" role="tabpanel" data-view="team" hidden>
        <header class="view-head">
          <p class="eyebrow" data-reveal><span class="index">02</span><span data-ui="team.eyebrow"></span></p>
          <h2 class="heading" data-reveal="mask"><span class="line"><span data-ui="team.title"></span></span></h2>
        </header>
        <div class="people" id="team"></div>
      </section>

      <section class="view" id="view-support" role="tabpanel" data-view="support" hidden>
        <header class="view-head">
          <p class="eyebrow" data-reveal><span class="index">03</span><span data-ui="support.eyebrow"></span></p>
          <h2 class="heading" data-reveal="mask"><span class="line"><span data-ui="support.title"></span></span></h2>
        </header>
        <div class="support" data-reveal>
          <p class="lead" data-ui="support.text"></p>
          <a class="button solid big" id="donate-button" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span id="copyright">© FrameBuffer Studio</span>
      <span class="footer-links" id="footer-links"></span>
    </footer>
  </body>
</html>
